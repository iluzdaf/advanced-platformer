name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CMAKE: 4.4.3
  LLVM: 23

jobs:
  formatting:
    name: Formatting
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      PRETTIER: 3.9.8
      RUFF: 0.16.8
      STYLUA: 2.5.2
      LUACHECK: 1.2.0
      GERSEMI: 0.29.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out submodules
        uses: ./.github/actions/checkout-submodules
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Install the pinned Prettier and StyLua
        run: |
          npm install --global --no-fund --no-audit \
            prettier@$PRETTIER \
            @johnnymorganz/stylua-bin@$STYLUA
          prettier --version
          stylua --version
      - name: Install the pinned Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ env.RUFF }}
          args: --version
      - name: Install the pinned Luacheck
        run: |
          sudo apt-get install -y -qq --no-install-recommends luarocks
          sudo luarocks install luacheck "$LUACHECK"
          luacheck --version
      - name: Install the pinned gersemi
        run: |
          pipx install "gersemi==$GERSEMI"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          "$(pipx environment --value PIPX_BIN_DIR)/gersemi" --version
      - name: Check formatting
        run: python3 tools/format.py --check
      - name: Test repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Configure
        run: cmake --preset linux-debug
      - name: Check Python lint
        run: cmake --build --preset linux-debug --target lint-python
      - name: Check Lua lint
        run: cmake --build --preset linux-debug --target lint-lua

  headers:
    name: Headers stand alone
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out submodules
        uses: ./.github/actions/checkout-submodules
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Configure
        run: >
          cmake --preset linux-debug
      - name: Check headers stand alone
        run: >
          cmake --build --preset linux-debug --target header_self_containment
          --parallel "$(nproc)"

  static-analysis:
    name: Static analysis (${{ matrix.shard }}/3)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out submodules
        uses: ./.github/actions/checkout-submodules
      - name: Select affected files
        id: targets
        env:
          BASE_REF: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
        run: |
          targets="$RUNNER_TEMP/tidy-targets.txt"
          python3 tools/tidy_targets.py --since "$BASE_REF" \
            | awk -v shard="$SHARD" '(NR - 1) % 3 + 1 == shard' > "$targets"

          count=$(wc -l < "$targets" | tr -d ' ')
          echo "$count files in this shard"
          if [ "$count" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.targets.outputs.has_files == 'true'
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Configure
        if: steps.targets.outputs.has_files == 'true'
        run: >
          cmake --preset linux-debug
      - name: Run static analysis
        if: steps.targets.outputs.has_files == 'true'
        run: |
          xargs -P"$(nproc)" -n1 \
            "$LLVM_ROOT/bin/clang-tidy" \
            -p build/linux-debug \
            --warnings-as-errors='*' \
            --quiet \
            < "$RUNNER_TEMP/tidy-targets.txt"

  static-analysis-result:
    name: Static analysis
    if: always() && github.event_name != 'push'
    needs: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Require every static analysis shard
        run: test "${{ needs.static-analysis.result }}" = success

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out submodules
        uses: ./.github/actions/checkout-submodules
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Configure
        run: >
          cmake --preset linux-debug
          -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_PATH"
          -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH"
      - name: Build
        run: cmake --build --preset linux-debug --parallel 3
      - name: Show compiler cache statistics
        run: '"$SCCACHE_PATH" --show-stats'
      - name: Test
        run: ctest --preset linux-debug

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out submodules
        uses: ./.github/actions/checkout-submodules
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Install LLVM's coverage tools and profile runtime
        run: >
          sudo apt-get install -y -qq --no-install-recommends
          "llvm-$LLVM" "libclang-rt-$LLVM-dev"
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Configure
        run: >
          cmake --preset linux-coverage
          -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_PATH"
          -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH"
      - name: Build
        run: cmake --build --preset linux-coverage --parallel 3
      - name: Measure coverage
        run: cmake --build --preset linux-coverage --target coverage
      - name: Summarise coverage
        run: |
          {
            echo '## Coverage'
            echo
            cat build/linux-coverage/coverage/summary.md
            echo
            echo '<details><summary>Every file</summary>'
            echo
            echo '```text'
            cat build/linux-coverage/coverage/report.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload line-by-line coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build/linux-coverage/coverage/html
