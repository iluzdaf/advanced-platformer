name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Every job builds on macOS with the same pinned CMake and Homebrew LLVM, the only
# toolchain the project supports.
env:
  CMAKE: 4.4.3
  LLVM: 23

jobs:
  formatting:
    name: Formatting
    # Strict branch protection runs this job, the header check, and static analysis before
    # a pull request can merge. Do not repeat them on the resulting push to main.
    if: github.event_name != 'push'
    runs-on: macos-latest
    env:
      PRETTIER: 3.9.8
      RUFF: 0.16.8
      STYLUA: 2.5.2
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Install the pinned Prettier and StyLua
        run: |
          npm install --global --no-fund --no-audit \
            prettier@$PRETTIER \
            @johnnymorganz/stylua-bin@$STYLUA
          prettier --version
          stylua --version
          echo "PRETTIER_BIN=$(command -v prettier)" >> "$GITHUB_ENV"
          echo "STYLUA_BIN=$(command -v stylua)" >> "$GITHUB_ENV"
      - name: Install the pinned Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ env.RUFF }}
          args: --version
      - name: Install Luacheck
        run: |
          brew install luacheck
          luacheck --version
      - name: Configure
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER="$LLVM_ROOT/bin/clang"
          -DCMAKE_CXX_COMPILER="$LLVM_ROOT/bin/clang++"
          -DPRETTIER_EXECUTABLE="$PRETTIER_BIN"
          -DSTYLUA_EXECUTABLE="$STYLUA_BIN"
      - name: Check formatting
        run: cmake --build --preset mac-debug --target format-check
      - name: Check JSON formatting
        run: cmake --build --preset mac-debug --target format-json-check
      - name: Check YAML formatting
        run: cmake --build --preset mac-debug --target format-yaml-check
      - name: Check Markdown formatting
        run: cmake --build --preset mac-debug --target format-markdown-check
      - name: Check Python formatting and lint
        run: cmake --build --preset mac-debug --target format-python-check lint-python
      - name: Test repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check Lua formatting
        run: cmake --build --preset mac-debug --target format-lua-check
      - name: Check Lua lint
        run: cmake --build --preset mac-debug --target lint-lua

  headers:
    name: Headers stand alone
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Configure
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER="$LLVM_ROOT/bin/clang"
          -DCMAKE_CXX_COMPILER="$LLVM_ROOT/bin/clang++"
      - name: Check headers stand alone
        run: >
          cmake --build --preset mac-debug --target header_self_containment
          --parallel "$(sysctl -n hw.ncpu)"

  static-analysis:
    name: Static analysis (${{ matrix.shard }}/3)
    # Header changes bring their transitive includers with them. Three shards keep
    # broad changes and full-tree fallbacks from returning to one long-running job.
    if: github.event_name != 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Select affected files
        id: targets
        env:
          BASE_REF: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Deal the files out in turn, so each shard gets every third one.
          targets="$RUNNER_TEMP/tidy-targets.txt"
          python3 tools/tidy_targets.py --since "$BASE_REF" \
            | awk -v shard="$SHARD" '(NR - 1) % 3 + 1 == shard' > "$targets"

          count=$(wc -l < "$targets" | tr -d ' ')
          echo "$count files in this shard"
          if [ "$count" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.targets.outputs.has_files == 'true'
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Configure
        if: steps.targets.outputs.has_files == 'true'
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER="$LLVM_ROOT/bin/clang"
          -DCMAKE_CXX_COMPILER="$LLVM_ROOT/bin/clang++"
      - name: Run static analysis
        if: steps.targets.outputs.has_files == 'true'
        run: |
          xargs -P"$(sysctl -n hw.ncpu)" -n1 \
            "$LLVM_ROOT/bin/clang-tidy" \
            -p build/mac-debug \
            --warnings-as-errors='*' \
            --quiet \
            < "$RUNNER_TEMP/tidy-targets.txt"

  static-analysis-result:
    name: Static analysis
    # The check branch protection requires, so it doesn't name each shard. A skipped job
    # would count as passing, so this one always runs and fails unless every shard succeeded.
    if: always() && github.event_name != 'push'
    needs: static-analysis
    runs-on: macos-latest
    steps:
      - name: Require every static analysis shard
        run: test "${{ needs.static-analysis.result }}" = success

  build-and-test:
    name: Build and test
    runs-on: macos-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          cmake: ${{ env.CMAKE }}
          llvm: ${{ env.LLVM }}
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Configure
        run: >
          cmake --preset mac-debug
          -DCMAKE_C_COMPILER="$LLVM_ROOT/bin/clang"
          -DCMAKE_CXX_COMPILER="$LLVM_ROOT/bin/clang++"
          -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_PATH"
          -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH"
      - name: Build
        run: cmake --build --preset mac-debug --parallel 3
      - name: Show compiler cache statistics
        run: '"$SCCACHE_PATH" --show-stats'
      - name: Test
        run: ctest --preset mac-debug
