name: Install LLVM
description: Installs clang and the named LLVM tools for one LLVM major version from apt.llvm.org.

inputs:
  version:
    description: The LLVM major version.
    required: true
  tools:
    description: Space-separated LLVM tools to install beside clang, such as clang-format.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install LLVM ${{ inputs.version }}
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_TOOLS: ${{ inputs.tools }}
      run: |
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor -o /etc/apt/keyrings/apt.llvm.org.gpg
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg]" \
          "https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM_VERSION main" \
          | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
        sudo apt-get update -qq
        packages="clang-$LLVM_VERSION"
        for tool in $LLVM_TOOLS; do
          packages="$packages $tool-$LLVM_VERSION"
        done
        sudo apt-get install -y -qq --no-install-recommends $packages
        clang-$LLVM_VERSION --version
        for tool in $LLVM_TOOLS; do
          "$tool-$LLVM_VERSION" --version
        done
